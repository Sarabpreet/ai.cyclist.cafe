name: Guide checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: guide-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install pinned pnpm and verify lockfile
        run: corepack pnpm@9.15.9 install --frozen-lockfile
      - name: Test documentation and assets
        run: corepack pnpm@9.15.9 test
      - name: Build standalone guide
        run: corepack pnpm@9.15.9 build
